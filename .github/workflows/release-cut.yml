# Release of this module. On every push to main the next version comes from the Conventional Commits since the last
# tag (Aedis Platform release-cut.yml: breaking → major, feat → minor, fix/perf/refactor/revert/deps → patch, anything
# else → no release) and the tag vX.Y.Z goes straight on the commit: the version of a Terraform module only exists in
# its tag, which is what the Terraform Registry publishes and what callers pin (`version = "X.Y.Z"`). On top of the
# tag, release-tag.yml publishes the immutable, attested GitHub Release with generated notes, moves the major tag
# `v1` (ignored by the Registry, which only reads SemVer tags) and keeps the CHANGELOG pull request. The first tag
# comes from a manual run with an explicit bump:
#   gh workflow run release-cut -R aedis-build/terraform-cloudflare-aedis -f bump=major
# Tag, release and pull request are made by the Aedis code App (AEDIS_CODER_APP_* organization secrets); without
# them the cut job warns and ends green.
name: release-cut

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Increment (auto = from the commits since the last tag; patch/minor/major also cut the first release)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions: {}

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    uses: aedis-build/aedis-platform/.github/workflows/release-cut.yml@86f5cc86348cc8de0c9cbdc65b6ce868a6f5d0cf # v2.0.0
    permissions:
      contents: read
    with:
      bump: ${{ inputs.bump || 'auto' }}
    secrets:
      app-id: ${{ secrets.AEDIS_CODER_APP_ID }}
      app-private-key: ${{ secrets.AEDIS_CODER_APP_PRIVATE_KEY }}

  publish:
    needs: cut
    if: needs.cut.outputs.tag != ''
    uses: aedis-build/aedis-platform/.github/workflows/release-tag.yml@86f5cc86348cc8de0c9cbdc65b6ce868a6f5d0cf # v2.0.0
    permissions:
      contents: read
    with:
      tag: ${{ needs.cut.outputs.tag }}
    secrets:
      app-id: ${{ secrets.AEDIS_CODER_APP_ID }}
      app-private-key: ${{ secrets.AEDIS_CODER_APP_PRIVATE_KEY }}
