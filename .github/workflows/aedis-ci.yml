# Quality pipeline of this module: Conventional Commits and SAST (Semgrep with the Aedis rules) through the Aedis
# Platform reusables, and the Terraform checks with no credentials and no network to Cloudflare: fmt, validate of the
# module and of every example, terraform test with the provider mocked, tflint and REUSE. The gate (gate.yml) listens
# for the end of this workflow on pull requests.
name: aedis-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run per pull request: a new push or closing the PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  commits:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/conventional-commits.yml@86f5cc86348cc8de0c9cbdc65b6ce868a6f5d0cf # v2.0.0
    permissions:
      contents: read

  sast:
    if: github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/sast.yml@86f5cc86348cc8de0c9cbdc65b6ce868a6f5d0cf # v2.0.0
    permissions:
      contents: read
      security-events: write

  terraform:
    if: github.event.action != 'closed'
    name: Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.59.1

      - name: fmt, validate, test and tflint (no credentials; nothing is applied)
        run: |
          set -euo pipefail
          terraform fmt -check -recursive -diff
          for d in . examples/*/; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
          terraform test
          tflint --init
          tflint --recursive

      - run: pipx run reuse==5.0.2 lint
